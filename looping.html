<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Looping</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Looping</h1>
  <div class="row">
    <label for="n">Enter n</label>
    <input type="number" id="n" min="1" max="100" step="1">
  </div>
  <br>
  <div class="row">
    <button id="fact">Factorial (While Loop)</button>
    <button id="sum">Sum (Do While Loop)</button>
    <button id="avg">Average (For Loop)</button>
  </div>
  <p id="result"></p>
  <a href="index.html">Back to Home Page</a>

  <script src="looping.js"></script>
</body>
</html>
